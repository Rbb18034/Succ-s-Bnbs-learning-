<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cours</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>📚 Gestion des cours</h1>
</header>

<div class="container">

<div class="card">
<h2>Publier un cours</h2>

<label><strong>🏫 Salle</strong></label>
<select id="salleCours">
    <option value="">Choisir une salle</option>
    <option>6e A</option>
    <option>4e</option>
    <option>3e</option>
    <option>Seconde C</option>
    <option>Première A</option>
    <option>Première C</option>
    <option>Première D</option>
    <option>Terminale A</option>
    <option>Terminale C</option>
    <option>Terminale D</option>
</select>

<br><br>

<label><strong>📚 Matière</strong></label>
<select id="matiereCours">
    <option value="">Choisir une matière</option>
    <option>Mathématiques</option>
    <option>Physique</option>
    <option>Chimie</option>
    <option>SVT</option>
    <option>Français</option>
    <option>Anglais</option>
    <option>Histoire-Géographie</option>
    <option>Informatique</option>
</select>

<br><br>

<input
type="text"
id="titre"
placeholder="Titre du cours">

<textarea
id="description"
placeholder="Description du cours">
</textarea>

<button onclick="publierCours()">
Publier le cours
</button>
</div>

<div class="card">

<h2>Liste des cours</h2>

<div id="listeCours">

<p>Aucun cours disponible.</p>

</div>

</div>

</div>
<script type="module" src="app.js"></script>
</body>
</html>
